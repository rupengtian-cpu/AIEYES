name: Daily AI Digest Update

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 运行
    - cron: "0 3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch latest AI papers, news & tools
        run: python3 scripts/fetch_data.py --papers 12 --news 12 --tools 20

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: daily AI digest $(date -u +%Y-%m-%d)"
            git push
          fi
